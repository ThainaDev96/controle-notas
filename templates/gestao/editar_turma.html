{% extends "base_sistema.html" %}
{% load static %}

{% block title %}Editar Turma{% endblock %}
{% block nav_academico_menu %}pcoded-trigger{% endblock %}
{% block nav_gestao_turmas %}active{% endblock %}

{% block content %}
<div class="page-header">
    <div class="row align-items-end">
        <div class="col-lg-8">
            <div class="page-header-title">
                <div class="d-inline">
                    <h4>Edição de Turma</h4>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-sm-12">
        <div class="card">
            <div class="card-header">
                <h5>Editar Turma</h5>
            </div>

            <div class="card-block">
                <form method="post" action="{% url 'editar-turma' turma.id %}">
                    {% csrf_token %}
                    <!-- NOME -->
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">Nome</label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control" name="nome"
                                value="{{ turma.nome }}" placeholder="Nome da turma" required>
                        </div>
                    </div>

                    <!-- DISCIPLINA -->
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">Disciplina</label>
                        <div class="col-sm-10">
                            <select name="disciplina" class="form-control" required>
                                <option value="">Selecione a disciplina</option>
                                {% for disciplina in disciplinas %}
                                    <option value="{{ disciplina.id }}" {% if disciplina.id == turma.disciplina_id %}selected{% endif %}>
                                        {{ disciplina.nome }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- BOTÕES -->
                    <div>
                        <a href="{% url 'gestao-turmas' %}" class="btn btn-out btn-danger btn-square" style="float: right; margin-right: 16px;">Cancelar</a>
                        <button type="submit" class="btn btn-out btn-primary btn-square" style="float: right; margin-right: 16px;">Salvar</button>
                    </div>
                </form>
            </div><!-- card-block -->
        </div><!-- card -->
    </div>
</div>
{% endblock %}
