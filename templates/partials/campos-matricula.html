{% comment %}
Campos do formulário de matrícula, usados no cadastro e na edição.
A turma é escolhida só pelo nome e pelo ano; o aluno fica vinculado a todas as disciplinas dela.
Espera no contexto: alunos, turmas (nomes), anos, aluno_selecionado, turma_selecionada, ano_selecionado.
{% endcomment %}
<!-- ALUNO -->
<div class="form-group row">
    <label class="col-sm-2 col-form-label">Aluno</label>
    <div class="col-sm-10">
        <select name="aluno" class="form-control" required>
            <option value="" disabled hidden {% if not aluno_selecionado %}selected{% endif %}>Selecione o aluno</option>
            {% for aluno in alunos %}
                <option value="{{ aluno.id }}" {% if aluno.id|stringformat:"s" == aluno_selecionado %}selected{% endif %}>
                    {{ aluno.first_name }}
                </option>
            {% endfor %}
        </select>
    </div>
</div>

<!-- TURMA -->
<div class="form-group row">
    <label class="col-sm-2 col-form-label">Turma</label>
    <div class="col-sm-10">
        <select name="turma" id="campo-turma" class="form-control" required>
            <option value="" disabled hidden {% if not turma_selecionada %}selected{% endif %}>Selecione a turma</option>
            {% for nome in turmas %}
                <option value="{{ nome }}" {% if nome == turma_selecionada %}selected{% endif %}>
                    {{ nome }}
                </option>
            {% endfor %}
        </select>
    </div>
</div>

<!-- ANO -->
<div class="form-group row">
    <label class="col-sm-2 col-form-label">Ano</label>
    <div class="col-sm-10">
        <select name="ano" id="campo-ano" class="form-control" required>
            {% for ano in anos %}
                <option value="{{ ano }}" {% if ano == ano_selecionado %}selected{% endif %}>
                    {{ ano }}
                </option>
            {% endfor %}
        </select>
    </div>
</div>

<!-- DISCIPLINAS DA TURMA: somente leitura, carregadas ao escolher a turma e o ano -->
<div class="form-group row" id="bloco-disciplinas" style="display: none;">
    <div class="col-sm-10 offset-sm-2">
        <label>Disciplinas da turma (serão vinculadas automaticamente)</label>
        <ul id="lista-disciplinas" class="mb-0"></ul>
    </div>
</div>
