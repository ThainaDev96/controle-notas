<div class="card regra-aprovacao">
    <div class="card-block">
        <h6 class="regra-aprovacao-titulo"><i class="ti-info-alt"></i> Regra de aprovação</h6>
        <ul class="regra-aprovacao-lista">
            <li><strong>Nota final ≥ 7,0</strong> → Aprovado</li>
            <li><strong>Nota final entre 4,0 e 7,0</strong> → Vai para exame</li>
            <li><strong>Nota final &lt; 4,0</strong> → Reprovado</li>
        </ul>
        <p class="regra-aprovacao-exame mb-0">
            Após o exame: <strong>A2 = (Nota Final + Nota do Exame) ÷ 2</strong>. A2 ≥ 6,0 aprova; abaixo disso, reprova.
        </p>
    </div>
</div>
