{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>Controle de Notas - Colégio Dom Bosco</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Favicon -->
    <link rel="icon" href="{% static 'assets/images/favicon.ico' %}" type="image/x-icon">

    <!-- Google font -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,800" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/icon/themify-icons/themify-icons.css' %}">
    <link rel="stylesheet" href="{% static 'assets/icon/icofont/css/icofont.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
    <style>
        .login-block {
            background: linear-gradient(115deg, #E6EAF4 0%, #E6EAF4 6%, #1B4DB2 38%, #E3172A 100%);
        }
        .theme-loader .ball-scale .contain .ring:first-child,
        .theme-loader .ball-scale .contain .ring:first-child .frame {
            border-left-color: #03458F;
            border-right-color: #03458F;
        }
        /* Botão de mostrar/esconder a senha, dentro do campo */
        .olho-senha {
            position: absolute;
            right: 4px;
            top: 1px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            padding: 0;
            color: #7b8794;
            background: transparent;
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            transition: color .15s ease;
        }
        .olho-senha:hover {
            color: #03458F;
        }
        .olho-senha:focus-visible {
            outline: 2px solid #03458F;
            outline-offset: 1px;
        }
        .olho-senha__aberto,
        .olho-senha--visivel .olho-senha__fechado {
            display: none;
        }
        .olho-senha--visivel .olho-senha__aberto {
            display: block;
        }
        /* O texto da senha não passa por baixo do ícone */
        #senha-login {
            padding-right: 40px;
        }
    </style>
    <!-- Tipografia do sistema: fica por último para valer sobre o tema; só age com a classe tema-tipografia no body -->
    <link rel="stylesheet" href="{% static 'css/tema-tipografia.css' %}?v=3">
</head>

<body class="fix-menu tema-tipografia">
    <!-- Pre-loader start -->
    <div class="theme-loader">
        <div class="ball-scale">
            <div class='contain'>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
                <div class="ring"><div class="frame"></div></div>
            </div>
        </div>
    </div>

    <section class="login-block">
        <!-- Container-fluid starts -->
        <div class="container">
            <div class="row">
                <div class="col-sm-12">
                    <!-- Authentication card start -->
                    
                        <form class="md-float-material form-material" action="{% url 'login' %}" method="post">
                            {% csrf_token %}
                            <div class="text-center">
                                <img src="{% static 'assets/images/logo1.png' %}" alt="logo1.png" width="260" style="filter: drop-shadow(0 8px 18px rgba(0,0,0,.6));">
                            </div>
                            <div class="auth-box card" style="margin-top: -10px;">
                                <div class="card-block">
                                    <div class="row m-b-20">
                                        <div class="col-md-12">
                                            <h3 class="text-center">Login</h3>
                                        </div>
                                    </div>
                                    {% if messages %}
                                        {% for message in messages %}
                                            <div style="color:red; font-weight:bold; margin-bottom:10px; text-align:center;">
                                                {{ message }}
                                            </div>
                                        {% endfor %}
                                    {% endif %}
                                    <div class="form-group form-primary">
                                        <input type="text" name="username" class="form-control" required placeholder="Usuário">
                                        <span class="form-bar"></span>
                                    </div>
                                    <div class="form-group form-primary" style="position: relative;">
                                        <input type="password" name="password" id="senha-login" class="form-control" required="" placeholder="Senha">
                                        <span class="form-bar"></span>
                                        <!-- Mostrar/esconder a senha: ícone em SVG, que fica nítido em qualquer tela -->
                                        <button type="button" id="toggle-senha-login" class="olho-senha"
                                            title="Mostrar senha" aria-label="Mostrar senha" aria-pressed="false">
                                            <!-- Ícones "visibility_off" e "visibility" do Material Icons (Google, licença Apache 2.0) -->
                                            <svg class="olho-senha__fechado" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
                                                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                                            </svg>
                                            <svg class="olho-senha__aberto" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
                                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                                            </svg>
                                        </button>
                                    </div>
                                    <div class="row m-t-30">
                                        <div class="col-md-12">
                                            <button type="submit" class="btn btn-md btn-block waves-effect waves-light text-center m-b-20" style="background-color: #03458F; border-color: #03458F; color: #fff;">Entrar</button>
                                        </div>
                                    </div>
                                    <hr>
                                    <!--<div class="row">
                                        <div class="col-md-10">
                                            <p class="text-inverse text-left m-b-0">Obrigado.</p>
                                        </div>
                                    </div>-->
                                </div>
                            </div>
                        </form>
                        <!-- end of form -->
                </div>
                <!-- end of col-sm-12 -->
            </div>
            <!-- end of row -->
        </div>
        <!-- end of container-fluid -->
    </section>

    <!-- Required Jquery -->
    <script src="{% static 'vendor/jquery/js/jquery.min.js' %}"></script>
    <script src="{% static 'vendor/jquery-ui/js/jquery-ui.min.js' %}"></script>
    <script src="{% static 'vendor/popper.js/js/popper.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap/js/bootstrap.min.js' %}"></script>
    <!-- jquery slimscroll js -->
    <script src="{% static 'vendor/jquery-slimscroll/js/jquery.slimscroll.js' %}"></script>
    <!-- modernizr js -->
    <script src="{% static 'vendor/modernizr/js/modernizr.js' %}"></script>
    <script src="{% static 'vendor/modernizr/js/css-scrollbars.js' %}"></script>
    <!-- i18next.min.js -->
    <script src="{% static 'vendor/i18next/js/i18next.min.js' %}"></script>
    <script src="{% static 'vendor/i18next-xhr-backend/js/i18nextXHRBackend.min.js' %}"></script>
    <script src="{% static 'vendor/i18next-browser-languagedetector/js/i18nextBrowserLanguageDetector.min.js' %}"></script>
    <script src="{% static 'vendor/jquery-i18next/js/jquery-i18next.min.js' %}"></script>
    <script src="{% static 'assets/js/common-pages.js' %}"></script>
<script>
    window.onload = function() {
        setTimeout(function() {
            document.querySelector('.theme-loader').style.display = 'none';
        }, 1500);
    }

    document.getElementById('toggle-senha-login').addEventListener('click', function () {
        var campo = document.getElementById('senha-login');
        var visivel = campo.type === 'text';
        campo.type = visivel ? 'password' : 'text';
        // Olho aberto enquanto a senha aparece; riscado enquanto está escondida.
        this.classList.toggle('olho-senha--visivel', !visivel);
        this.title = visivel ? 'Mostrar senha' : 'Esconder senha';
        this.setAttribute('aria-label', this.title);
        this.setAttribute('aria-pressed', String(!visivel));
    });
</script>
</body>
</html>
